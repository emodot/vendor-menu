<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cruzz Avenue — QR Menu Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink: #ff2d78;
      --pink-glow: #ff2d7880;
      --purple: #7b2fff;
      --bg: #0d0010;
      --card: #160022;
      --border: #ff2d7840;
      --text: #f0d0ff;
      --muted: #9060aa;
    }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 100% 50% at 50% 0%, #3a006680 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 90% 90%, #ff2d7818 0%, transparent 60%);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* ── HEADER ── */
    .header {
      text-align: center;
      margin-bottom: 48px;
    }

    .event-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--pink);
      border: 1px solid var(--pink);
      padding: 3px 12px;
      border-radius: 2px;
      margin-bottom: 16px;
      text-shadow: 0 0 10px var(--pink-glow);
    }

    h1 {
      font-family: 'Black Ops One', cursive;
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      line-height: 0.9;
      background: linear-gradient(135deg, #fff 20%, var(--pink) 60%, #ff6eb0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 16px var(--pink-glow));
      letter-spacing: -1px;
    }

    .theme-tag {
      display: inline-block;
      margin-top: 12px;
      font-family: 'Black Ops One', cursive;
      font-size: 0.9rem;
      letter-spacing: 4px;
      color: var(--purple);
      text-shadow: 0 0 12px #7b2fff80;
    }

    .event-meta {
      margin-top: 8px;
      font-size: 0.8rem;
      letter-spacing: 1px;
      color: var(--muted);
    }

    /* ── QR GRID ── */
    .qr-grid {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .qr-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .qr-wrap {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 0 40px var(--pink-glow);
      position: relative;
    }

    .qr-wrap.offline {
      box-shadow: 0 0 40px #7b2fff60;
    }

    .qr-wrap canvas {
      display: block;
    }

    .qr-label {
      margin-top: 20px;
      text-align: center;
    }

    .qr-label .tag {
      display: inline-block;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 2px;
      margin-bottom: 8px;
    }

    .qr-block:first-child .tag {
      background: var(--pink);
      color: #fff;
      text-shadow: none;
    }

    .qr-block:last-child .tag {
      background: var(--purple);
      color: #fff;
      text-shadow: none;
    }

    .qr-label h3 {
      font-family: 'Black Ops One', cursive;
      font-size: 1rem;
      letter-spacing: 1px;
      color: var(--text);
    }

    .qr-label p {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 4px;
      max-width: 180px;
      line-height: 1.4;
    }

    /* ── DIVIDER ── */
    .divider {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 2px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0 8px;
    }

    .divider::before,
    .divider::after {
      content: '';
      width: 1px;
      height: 40px;
      background: linear-gradient(to bottom, transparent, var(--border), transparent);
    }

    /* ── FOOTER ── */
    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 1px;
    }

    footer a {
      color: var(--pink);
      text-decoration: none;
    }

    /* ── PRINT STYLES ── */
    @media print {
      body {
        background: #fff;
        color: #000;
      }
      .qr-wrap {
        box-shadow: none;
        border: 1px solid #ddd;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="event-badge">Scan to Order</div>
    <h1>CRUZZ<br>AVENUE</h1>
    <div class="theme-tag">✦ INFERNO 2.0 ✦</div>
    <p class="event-meta">Wed, June 10 · 8PM · Ketu, Lagos</p>
  </div>

  <div class="qr-grid">

    <!-- QR 1: URL -->
    <div class="qr-block">
      <div class="qr-wrap" id="qr-url"></div>
      <div class="qr-label">
        <div class="tag">Main Menu</div>
        <h3>View Full Menu</h3>
        <p>Scan to open the menu in your browser</p>
      </div>
    </div>

    <div class="divider">or</div>

    <!-- QR 2: Offline text -->
    <div class="qr-block">
      <div class="qr-wrap offline" id="qr-offline"></div>
      <div class="qr-label">
        <div class="tag">No Internet?</div>
        <h3>Offline Menu</h3>
        <p>Scan to save the menu to your notes — no WiFi needed</p>
      </div>
    </div>

  </div>

  <footer>
    <p>Come with a bottle to fuel the fire ···</p>
  </footer>

  <script>
    // ── CONFIG ──────────────────────────────────────────────
    // Replace this with your Netlify URL once deployed
    const MENU_URL = 'https://cruzz-avenue-menu.netlify.app';

    const MENU_TEXT = `CRUZZ AVENUE - INFERNO 2.0
FOOD
1 Chicken+2 Sides N6k
2 Chicken+3 Sides N10k
6 Chicken+5 Sides N25k
Chicken N3k | Side N1.5k
Sides: Chips,Sweet Potato,Plantain,Grilled Corn,Grilled Plantain
DRINKS
Olemca N35k | Jameson N35k
Martell N70k | Henny N70k
Gordon N5k | Sierra N15k
Coke/Sprite/Predator N1k | Water N500
SHISHA N10k`;
    // ────────────────────────────────────────────────────────

    new QRCode(document.getElementById('qr-url'), {
      text: MENU_URL,
      width: 200,
      height: 200,
      colorDark: '#0d0010',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M,
    });

    new QRCode(document.getElementById('qr-offline'), {
      text: MENU_TEXT,
      width: 200,
      height: 200,
      colorDark: '#1a0033',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.L,
    });
  </script>

</body>
</html>
