<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cruzz Avenue — Scan to Order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Syne+Mono&family=Syne:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080008;
      --surface: #0f000f;
      --pink: #ff2060;
      --cream: #f5e6f0;
      --muted: #6b4d6b;
      --rule: #2a0c2a;
    }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
      gap: 64px;
    }

    /* ── HEADER ── */
    header {
      text-align: center;
    }

    .eyebrow {
      font-family: 'Syne Mono', monospace;
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--pink);
      display: block;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Dela Gothic One', cursive;
      font-size: clamp(3rem, 10vw, 6rem);
      line-height: 0.9;
      letter-spacing: -2px;
      color: var(--cream);
    }

    h1 .pink { color: var(--pink); }

    .meta {
      margin-top: 20px;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 2;
    }

    /* ── QR GRID ── */
    .grid {
      display: flex;
      align-items: flex-start;
      gap: 48px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .qr-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .qr-frame {
      background: var(--cream);
      padding: 14px;
    }

    .qr-frame canvas { display: block; }

    .qr-label {
      text-align: center;
    }

    .qr-tag {
      display: inline-block;
      font-family: 'Syne Mono', monospace;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 4px 12px;
      border: 1px solid var(--rule);
      color: var(--muted);
      margin-bottom: 10px;
    }

    .qr-block:first-child .qr-tag {
      border-color: var(--pink);
      color: var(--pink);
    }

    .qr-title {
      font-family: 'Dela Gothic One', cursive;
      font-size: 1rem;
      letter-spacing: 0.5px;
      color: var(--cream);
    }

    .qr-desc {
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--muted);
      max-width: 160px;
      line-height: 1.6;
    }

    /* ── DIVIDER ── */
    .sep {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding-top: 32px;
    }

    .sep::before,
    .sep::after {
      content: '';
      width: 1px;
      height: 48px;
      background: var(--rule);
    }

    .sep span {
      font-family: 'Syne Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--rule);
      padding-top: 32px;
      width: 100%;
      max-width: 560px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .footer-text {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--pink);
      flex-shrink: 0;
    }

    @media (max-width: 560px) {
      .sep { display: none; }
      footer { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

  <header>
    <span class="eyebrow">✦ Scan to Order ✦</span>
    <h1>CRUZZ<br><span class="pink">AVENUE</span></h1>
    <p class="meta">Inferno 2.0 · Wed June 10 · 8PM · Ketu</p>
  </header>

  <div class="grid">

    <div class="qr-block">
      <div class="qr-frame" id="qr-url"></div>
      <div class="qr-label">
        <div class="qr-tag">Main Menu</div>
        <div class="qr-title">View Full Menu</div>
        <p class="qr-desc">Opens the menu in your browser</p>
      </div>
    </div>

    <div class="sep"><span>or</span></div>

    <div class="qr-block">
      <div class="qr-frame" id="qr-offline"></div>
      <div class="qr-label">
        <div class="qr-tag">No Internet?</div>
        <div class="qr-title">Offline Menu</div>
        <p class="qr-desc">Saves the menu to your notes — no WiFi needed</p>
      </div>
    </div>

  </div>

  <footer>
    <span class="footer-text">Come with a bottle</span>
    <div class="dot"></div>
    <span class="footer-text">to fuel the fire</span>
  </footer>

  <script>
    const MENU_URL = 'https://cruzz-avenue-menu.vercel.app';

    const MENU_TEXT = `CRUZZ AVENUE - INFERNO 2.0
FOOD
1 Chicken+2 Sides N6k
2 Chicken+3 Sides N10k
6 Chicken+5 Sides N25k
Chicken N3k | Side N1.5k
Sides: Chips,Sweet Potato,Plantain,Grilled Corn,Grilled Plantain
DRINKS
Olemca N35k | Jameson N35k
Martell N70k | Henny N70k
Gordon N5k | Sierra N15k
Coke/Sprite/Predator N1k | Water N500
SHISHA N10k`;

    new QRCode(document.getElementById('qr-url'), {
      text: MENU_URL,
      width: 200,
      height: 200,
      colorDark: '#080008',
      colorLight: '#f5e6f0',
      correctLevel: QRCode.CorrectLevel.M,
    });

    new QRCode(document.getElementById('qr-offline'), {
      text: MENU_TEXT,
      width: 200,
      height: 200,
      colorDark: '#080008',
      colorLight: '#f5e6f0',
      correctLevel: QRCode.CorrectLevel.L,
    });
  </script>

</body>
</html>
